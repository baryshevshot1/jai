# Минимальная версия macOS для сборки. whisper.cpp (голосовой ввод) использует
# std::filesystem, который доступен с macOS 10.15, а Tauri по умолчанию целится
# ниже — без этой переменной сборка релиза падает на непонятных ошибках вида
# «'path' is unavailable». Задаём здесь, а не в команде сборки: иначе на неё
# наткнётся каждый, кто соберёт проект впервые.
#
# Если сборка всё равно падает с упоминанием 10.13 — виноват кэш cmake от прежней
# попытки: удалите src-tauri/target/*/build/whisper-rs-sys-* и повторите.
[env]
MACOSX_DEPLOYMENT_TARGET = "10.15"
CMAKE_OSX_DEPLOYMENT_TARGET = "10.15"
