# Быстрая сетка безопасности на каждый PR и push в main: тесты Rust, clippy, строгий tsc,
# и — главное — компиляция Windows-веток (#[cfg(windows)]: DXGI и пр.), которые
# на Mac разработчика не собираются вовсе. Установщики здесь НЕ собираются —
# это делает release.yml по тегу app-v*.
#
# Все actions закреплены SHA коммита (тег рядом — только комментарий): подвижный
# тег могут переставить на вредоносный коммит. Свежесть пинов ведёт dependabot
# (.github/dependabot.yml) через PR с ревью.
name: ci

# ЗАПУСК ТОЛЬКО ВРУЧНУЮ. GitHub Actions этому аккаунту недоступны (заблокирован по
# оплате), и автозапуск давал бы поток красных прогонов, к которым все привыкают и
# перестают смотреть. Источник правды о качестве — tools/check.sh на машине
# разработчика; этот файл продолжает ДОКУМЕНТИРОВАТЬ, что должно проверяться, и
# включится обратно (`pull_request` + `push`) без переписывания, когда Actions
# заработают. Набор проверок здесь обязан совпадать с tools/check.sh.
on:
  workflow_dispatch:

# Проверкам достаточно чтения — здесь ничего не публикуется.
permissions:
  contents: read

# Новый пуш в ту же ветку отменяет уже идущую проверку (экономим минуты CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Тесты (Ubuntu) + фронтенд
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Не оставлять токен в .git/config: дальше выполняются чужие
          # postinstall-скрипты npm и build.rs крейтов, им токен не положен.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Версия Node — из .nvmrc, чтобы CI и разработка не расходились.
          node-version-file: .nvmrc
          cache: npm

      - name: Фронтенд — tsc strict + vite build
        # Также создаёт dist/: generate_context! в Tauri требует frontendDist
        # уже на этапе КОМПИЛЯЦИИ Rust, иначе cargo test не соберётся.
        run: |
          npm ci
          npm run build

      - name: Тесты фронтенда
        # Санитайзер Markdown (XSS + целость формул/подсветки) и разбор ошибок:
        # регрессия здесь либо открывает дыру, либо ломает вывод ответа.
        run: npm test

      - name: Уязвимости в зависимостях фронтенда
        # Только то, что реально попадает в приложение (--omit=dev): библиотеки
        # разработки в бандл не уезжают. Порог high — шум от low/moderate в
        # инструментах сборки не должен валить сборку.
        #
        # Почему это важно именно здесь: через markdown-it и его linkify проходит
        # НЕДОВЕРЕННЫЙ текст — ответ модели, содержимое документов, результаты
        # веб-поиска. Так уже находили квадратичную сложность в linkify-it
        # (GHSA-v245-v573-v5vm): подготовленный текст в документе подвешивал бы
        # интерфейс.
        run: npm audit --omit=dev --audit-level=high

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # ветка stable
        with:
          # Действующая версия — из rust-toolchain.toml (её cargo и слушается);
          # здесь дублируем, чтобы action ставил сразу нужную, а не лишнюю stable.
          toolchain: '1.96.0'
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: './src-tauri -> target'

      - name: Системные зависимости Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Clippy
        # Строго: замечаний в коде не осталось, и новое не должно проскочить незаметно.
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Формат Rust (информационно)
        # Кодовая база исторически не под rustfmt: шаг показывает расхождения,
        # но сборку не валит — до разового согласованного cargo fmt.
        continue-on-error: true
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Тесты Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  windows:
    name: Тесты (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Фронтенд — tsc strict + vite build
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # ветка stable
        with:
          toolchain: '1.96.0'
          components: clippy

      - uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: './src-tauri -> target'

      - name: Clippy (включая Windows-ветки cfg)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Тесты Rust (включая Windows-ветки cfg)
        # Именно тесты, не только check: восстановление повреждённой documents.db
        # завязано на семантику файловой системы Windows (rename при открытом
        # хендле) — тест recovers_from_corrupt_db проверяет её по-настоящему.
        run: cargo test --manifest-path src-tauri/Cargo.toml
