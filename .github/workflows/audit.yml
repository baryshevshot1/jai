name: Аудит зависимостей

# Уязвимости в зависимостях появляются СО ВРЕМЕНЕМ, а не с каждым коммитом: код мог
# не меняться месяц, а библиотека в нём — стать опасной. Поэтому проверка идёт по
# расписанию, а не в каждом PR: так она не тормозит работу, но и не пропускает
# advisory, вышедший после слияния.
#
# Быстрая проверка npm живёт в ci.yml и валит сборку — она бесплатна по времени.
# Здесь же полный обход, включая Rust: cargo-audit нужно компилировать (~2 минуты),
# и делать это на каждый PR не стоит.
on:
  schedule:
    - cron: '0 6 * * 1' # каждый понедельник, 06:00 UTC
  workflow_dispatch: # и вручную, когда нужно проверить прямо сейчас

permissions:
  contents: read

jobs:
  audit:
    name: Уязвимости в зависимостях
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Зависимости фронтенда
        # --omit=dev: проверяем только то, что реально уезжает в приложение.
        # Через markdown-it и linkify проходит НЕДОВЕРЕННЫЙ текст (ответ модели,
        # содержимое документов, результаты веб-поиска), поэтому уровень high тут
        # означает реальный риск, а не формальность.
        run: npm audit --omit=dev --audit-level=high

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # ветка stable

      - name: Установка cargo-audit
        run: cargo install cargo-audit --locked

      - name: Зависимости бэкенда
        # Без --deny warnings: GTK3-биндинги, которые тянет сам Tauri, помечены
        # «не поддерживаются». Это не уязвимости и не в нашей власти — валить
        # проверку из-за них значит приучить всех её игнорировать.
        run: cargo audit --file src-tauri/Cargo.lock
